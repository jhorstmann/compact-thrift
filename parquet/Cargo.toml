[package]
name = "compact-thrift-parquet"
version = "0.4.0"
license = "Apache-2.0"
description = "Parquet metadata structures generated from thrift definitions"
homepage = "https://github.com/jhorstmann/compact-thrift"
repository = "https://github.com/jhorstmann/compact-thrift"
authors = ["Jörn Horstmann <git@jhorstmann.net>"]
keywords = ["thrift", "parquet"]
readme = "README.md"
edition = "2021"
rust-version = "1.91.0"

[lints.clippy]
manual_range_contains = "allow"

[dependencies]
compact-thrift-runtime = { version = "0.3", path = "../runtime" }

[dev-dependencies]
criterion = "0.5.1"
jemallocator = "0.5.4"

[[bench]]
name = "filemetadata"
harness = false
